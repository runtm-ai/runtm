name: Terraform

# Format, validate and unit-test the customer-applied modules. `terraform test`
# runs against mock providers: nothing is created in any cloud.

on:
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

jobs:
  gcp-sandbox:
    name: gcp-sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test
