name: Sandbox router image

# ghcr.io/runtm-ai/runtm-sandbox-router: the preview router customer clusters
# run with terraform/gcp-sandbox's `preview` input (Caddy + caddy-jwt).
#
#   :latest       moves on every build; the module deploys it with
#                 imagePullPolicy Always, so a restarted router picks it up
#   :sha-<commit> immutable, for `router_image` pins and mirrors
#
# Rebuilt weekly so Alpine and Go security fixes land without a code change.
# Pull requests build and smoke-test only. The package must be public (set once
# in the org's package settings) for clusters to pull it anonymously.

on:
  push:
    branches: [main]
    paths:
      - terraform/gcp-sandbox/router/**
      - .github/workflows/sandbox-router-image.yml
  pull_request:
    branches: [main]
    paths:
      - terraform/gcp-sandbox/router/**
      - .github/workflows/sandbox-router-image.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/runtm-ai/runtm-sandbox-router
  CONTEXT: terraform/gcp-sandbox/router

jobs:
  build:
    name: Build, smoke test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: router:smoke

      # Health and host routing only: token checks need Runtm's keys, and the
      # router's behaviour with them is covered by the module's local tests.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name router -p 8080:8080 \
            -e RUNTM_PREVIEW_DOMAIN=runtm.example.com \
            -e 'RUNTM_PREVIEW_DOMAIN_RE=runtm\.example\.com' \
            -e RUNTM_PREVIEW_JWKS_URL=https://example.com/jwks.json \
            -e RUNTM_APP_ORIGIN=https://app.example.com \
            -e RUNTM_PROXY_CIDRS=10.0.0.0/8 \
            router:smoke
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/__runtm/healthz >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/__runtm/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.example.org' localhost:8080/)" = 404
          docker logs router
          docker rm -f router

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Runtm sandbox preview router (terraform/gcp-sandbox, previews on your own domain)
