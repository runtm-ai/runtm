AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Runtm Cloud - AWS Lambda MicroVMs sandbox integration. Creates the access
  role Runtm assumes with your organization's own Google identity
  (AssumeRoleWithWebIdentity, no IAM OIDC provider needed), the MicroVM build
  and execution roles, and an artifact bucket. Nothing here grants Runtm
  access to anything outside Lambda MicroVMs and the artifact bucket.
  Template version: v2 (see .plan/aws-byo-org-identity-options.md).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Runtm (pre-filled, do not edit)" }
        Parameters: [GoogleEmail, GoogleSubject, GoogleAudience, OrganizationId]
      - Label: { default: "Optional" }
        Parameters: [ArtifactRetentionDays, SessionArtifactRetentionDays, TemplateVersionsToKeep, TemplateVersionRetentionDays]

Parameters:
  # Runtm mints one Google service account PER organization. Its email is
  # derived from your organization id (runtm-aws-<sha256(org)[:20]>@<runtm
  # project>) and is what the trust pins; nothing outside Runtm's identity
  # project can produce a token with it, so no shared-secret external id is
  # needed. The numeric unique id is pinned as well for the one-click path
  # (leave it empty to trust the email alone, as the Terraform module does).
  GoogleEmail:
    Type: String
    Description: Email of your organization's Runtm Google service account (pre-filled by Runtm).
    AllowedPattern: "^runtm-aws-[a-f0-9]{20}@[a-z][a-z0-9-]+\\.iam\\.gserviceaccount\\.com$"
  GoogleSubject:
    Type: String
    Description: Numeric unique id of that service account (pre-filled by Runtm). Optional; empty = trust the email alone.
    Default: ""
    AllowedPattern: "^([0-9]{10,30})?$"
  # The audience Runtm requests when minting the token, also per organization.
  # Pinned with accounts.google.com:oaud: service-account ID tokens carry azp
  # (= the account's numeric id), and with azp present AWS maps :aud to azp and
  # :oaud to the token's aud. Pinning :aud to this string would deny everything.
  GoogleAudience:
    Type: String
    Description: Token audience Runtm requests for this organization (pre-filled by Runtm, runtm-sandbox:<org>).
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9:._-]+$"
  OrganizationId:
    Type: String
    Description: Runtm organization id (used for tagging only).
    MaxLength: 64
    Default: ""
  ArtifactRetentionDays:
    Type: Number
    Description: Days to keep template/image build artifacts in the bucket.
    Default: 90
    MinValue: 7
  SessionArtifactRetentionDays:
    Type: Number
    Description: Days to keep paused-session filesystem snapshots in the bucket (matches Runtm's paused-session retention).
    Default: 90
    MinValue: 1
  TemplateVersionsToKeep:
    Type: Number
    Description: Template goldens (templates/) never expire; each rebuild overwrites the object and the bucket is versioned. Previous versions kept for rollback.
    Default: 3
    MinValue: 1
    MaxValue: 100
  TemplateVersionRetentionDays:
    Type: Number
    Description: Days a superseded template golden version is kept once older than the newest TemplateVersionsToKeep.
    Default: 30
    MinValue: 1

Conditions:
  PinSubject: !Not [!Equals [!Ref GoogleSubject, ""]]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "runtm-sandbox-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Versioned so an overwritten template golden keeps its previous
      # versions (rollback) and a template never silently loses the tarball
      # every session imports. Superseded build contexts / session snapshots
      # are purged a day after they are replaced.
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          # images/ = image build contexts, only read while Lambda builds the image.
          - Id: expire-image-artifacts
            Status: Enabled
            Prefix: images/
            ExpirationInDays: !Ref ArtifactRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          # sessions/ = paused-session snapshots.
          - Id: expire-session-snapshots
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: !Ref SessionArtifactRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          # templates/ = template goldens. The CURRENT version never expires;
          # only superseded versions beyond the newest N are purged.
          - Id: retain-template-goldens
            Status: Enabled
            Prefix: templates/
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref TemplateVersionRetentionDays
              NewerNoncurrentVersions: !Ref TemplateVersionsToKeep
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
            ExpiredObjectDeleteMarker: true
      Tags:
        - { Key: runtm:organization, Value: !Ref OrganizationId }
        - { Key: runtm:component, Value: sandbox-artifacts }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # Assumed by the Lambda service while it builds a MicroVM image from the zip
  # Runtm uploads to the artifact bucket.
  MicrovmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "RuntmMicrovmBuildRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: runtm-microvm-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/images/*"
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/runtm/*"
      Tags:
        - { Key: runtm:organization, Value: !Ref OrganizationId }

  # Assumed by the MicroVM itself at runtime. Deliberately minimal: the
  # sandbox gets CloudWatch logging and nothing else. Add statements here if
  # your agents should reach other AWS services from inside the sandbox.
  MicrovmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "RuntmMicrovmExecutionRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      Policies:
        - PolicyName: runtm-microvm-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/runtm/*"
      Tags:
        - { Key: runtm:organization, Value: !Ref OrganizationId }

  # The role Runtm's control plane assumes. Trust is pinned to your
  # organization's Google service account (subject) and the audience Runtm
  # requests. Google is a built-in web-identity provider in AWS, so no IAM OIDC
  # provider resource is created here. 12h sessions: AssumeRoleWithWebIdentity
  # is not role chaining, so the 1h chaining cap does not apply.
  RuntmSandboxAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "RuntmSandboxAccessRole-${AWS::Region}"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: accounts.google.com }
            Action: ["sts:AssumeRoleWithWebIdentity", "sts:TagSession"]
            Condition:
              StringEquals: !If
                - PinSubject
                - "accounts.google.com:email": !Ref GoogleEmail
                  "accounts.google.com:sub": !Ref GoogleSubject
                  "accounts.google.com:oaud": !Ref GoogleAudience
                - "accounts.google.com:email": !Ref GoogleEmail
                  "accounts.google.com:oaud": !Ref GoogleAudience
      Policies:
        - PolicyName: runtm-sandbox-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Discover
                Effect: Allow
                Action:
                  - lambda:ListMicrovms
                  - lambda:ListMicrovmImages
                  - lambda:ListManagedMicrovmImages
                  - lambda:ListManagedMicrovmImageVersions
                  - sts:GetCallerIdentity
                Resource: "*"
              # Create is authorised against "*" (no ARN exists yet); everything
              # touching an EXISTING image stays scoped to runtm-* below.
              - Sid: CreateRuntmImages
                Effect: Allow
                Action: [lambda:CreateMicrovmImage, lambda:TagResource] # TagResource = tag-on-create
                Resource: "*"
              - Sid: ManageRuntmImages
                Effect: Allow
                Action:
                  - lambda:UpdateMicrovmImage
                  - lambda:UpdateMicrovmImageVersion
                  - lambda:DeleteMicrovmImage
                  - lambda:DeleteMicrovmImageVersion
                  - lambda:GetMicrovmImage
                  - lambda:GetMicrovmImageVersion
                  - lambda:GetMicrovmImageBuild
                  - lambda:ListMicrovmImageVersions
                  - lambda:ListMicrovmImageBuilds
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:runtm-*"
              - Sid: RunSandboxes
                Effect: Allow
                Action:
                  - lambda:RunMicrovm
                  - lambda:GetMicrovm
                  - lambda:SuspendMicrovm
                  - lambda:ResumeMicrovm
                  - lambda:TerminateMicrovm
                  - lambda:CreateMicrovmAuthToken
                  - lambda:CreateMicrovmShellAuthToken
                Resource: "*"
              # AWS-managed connectors (INTERNET_EGRESS/ALL_INGRESS/SHELL_INGRESS, account
              # "aws") + any VPC connector created in this account.
              - Sid: PassNetworkConnectors
                Effect: Allow
                Action: ["lambda:PassNetworkConnector"]
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:network-connector:*"
              # Scoped to exactly these two roles; no PassedToService condition —
              # the MicroVMs service passes them under its own principal.
              - Sid: PassMicrovmRoles
                Effect: Allow
                Action: ["iam:PassRole"]
                Resource:
                  - !GetAtt MicrovmBuildRole.Arn
                  - !GetAtt MicrovmExecutionRole.Arn
              - Sid: Artifacts
                Effect: Allow
                Action: ["s3:PutObject", "s3:GetObject", "s3:DeleteObject", "s3:AbortMultipartUpload"]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactBucketMeta
                Effect: Allow
                Action: ["s3:ListBucket", "s3:GetBucketLocation"]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ReadBuildLogs
                Effect: Allow
                Action: ["logs:FilterLogEvents", "logs:GetLogEvents", "logs:DescribeLogStreams"]
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/runtm/*"
      Tags:
        - { Key: runtm:organization, Value: !Ref OrganizationId }

Outputs:
  RoleArn:
    Description: Paste this into Runtm (Integrations -> AWS Lambda MicroVMs).
    Value: !GetAtt RuntmSandboxAccessRole.Arn
  GoogleEmail:
    Value: !Ref GoogleEmail
  GoogleSubject:
    Value: !Ref GoogleSubject
  GoogleAudience:
    Value: !Ref GoogleAudience
  AccountId:
    Value: !Ref "AWS::AccountId"
  Region:
    Value: !Ref "AWS::Region"
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Value: !GetAtt MicrovmBuildRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt MicrovmExecutionRole.Arn
